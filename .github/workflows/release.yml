name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.0.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "Building Linux package for version ${RAW_VER}"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Build Debian Package
        run: |
          chmod +x linux/build.sh engine/omniserv engine/platform-linux.sh
          ./linux/build.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: linux/dist/*.deb
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg & .pkg)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "Building macOS package for version ${RAW_VER}"

      - name: Build macOS App and Distributables
        run: |
          chmod +x macos/build-app.sh macos/make-dist.sh engine/omniserv
          ./macos/make-dist.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.pkg
          if-no-files-found: error

  build-windows:
    name: Build Windows (Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Determine Version
        id: ver
        shell: powershell
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          }
          Write-Host "Building Windows package for version $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build OmniServ Windows Installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/installer/dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
